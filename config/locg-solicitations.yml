# yaml-language-server: $schema=https://raw.githubusercontent.com/not-first/glance-schema/master/schema.json#/definitions/widget
- type: custom-api
  title: Solicitations
  frameless: true
  cache: 1h
  # Add publishers you want to hide to the ?exclude= list (comma separated, exact names, user URL encoding for spaces eg. Square%20Enix).
  # New publishers will appear automatically unless added to the exclude list.
  # To show everything, remove ?exclude=... from the URL entirely.
  url: "http://locg_bridge:4463/solicitations/grouped?exclude=Dynamite,Kodansha,Tokyopop,Titan%20Comics,Rebellion,Square%20Enix,Ignition%20Comics,Seven%20Seas%20Entertainment"
  template: |
    {{ $months := .JSON.Array "" }}
    {{ if gt (len $months) 0 }}
      <div style="padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 20px;">
        {{ range $months }}
          <div>
            <div style="font-size: 0.7em; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.4; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--color-border);">
              {{ .String "month" }}
            </div>
            <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;">
              {{ range .Array "cards" }}
                <a href="{{ .String "link" }}" target="_blank"
                  style="flex: 0 0 200px; text-decoration: none; color: inherit;">
                  {{ $image := .String "image_url" }}
                  {{ if ne $image "" }}
                    <img src="{{ $image }}"
                        alt="{{ .String "publisher" }}"
                        loading="lazy"
                        style="width: 200px; height: 130px; object-fit: cover; border-radius: var(--border-radius); display: block;" />
                  {{ else }}
                    <div style="width: 200px; height: 130px; background: var(--color-background-secondary); border-radius: var(--border-radius); display: flex; align-items: center; justify-content: center; opacity: 0.4;">
                      No image
                    </div>
                  {{ end }}
                  <div style="margin-top: 5px; font-size: 0.75em; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--color-primary); font-weight: 600;">
                    {{ .String "publisher" }}
                  </div>
                </a>
              {{ end }}
            </div>
          </div>
        {{ end }}
      </div>
    {{ else }}
      <div class="padding-inline-widget margin-top-10 margin-bottom-10">
        No solicitations available.
      </div>
    {{ end }}