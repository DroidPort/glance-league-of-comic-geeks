- type: custom-api
  title: Upcoming
  cache: 30m
  url: http://locg_bridge:4463/pull-list-plus-popular?user_id=YOUR_USER_ID&popular_limit=30
  template: |
    <style>
      .comic-board {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .pulls-section {
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }

      .popular-section {
        display: grid;
        grid-template-columns: repeat(10, 54px);
        grid-template-rows: repeat(3, 81px);
        gap: 8px;
        flex-shrink: 0;
      }

      /* Primary pulls — tall cards with title/publisher text */
      .comic-pull {
        display: flex;
        flex-direction: column;
        width: 140px;
        flex-shrink: 0;
        text-decoration: none;
        color: inherit;
      }
      .comic-pull img {
        width: 140px;
        aspect-ratio: 2/3;
        object-fit: cover;
        border-radius: var(--border-radius);
        display: block;
      }
      .comic-pull .comic-meta {
        margin-top: 6px;
        font-size: 0.8em;
        line-height: 1.3;
      }
      .comic-pull .comic-title {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        color: var(--color-primary);
      }
      .comic-pull .comic-publisher {
        opacity: 0.6;
        margin-top: 2px;
      }

      /* Popular filler — small covers, no text */
      .comic-popular {
        display: flex;
        flex-direction: column;
      }
      .comic-popular img {
        width: 54px;
        height: 81px;
        object-fit: cover;
        border-radius: 3px;
        display: block;
        opacity: 0.85;
        transition: opacity 0.15s ease;
      }
      .comic-popular img:hover {
        opacity: 1;
      }

      .section-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--color-primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        text-decoration: none;
        display: inline-block;
      }
      .section-title:hover {
        opacity: 0.8;
      }
    </style>

    {{ $pulls := .JSON.Get "my_pulls" }}
    {{ $popular := .JSON.Get "popular" }}
    {{ $nextWeek := (now).AddDate 0 0 7 }}
    <div class="comic-board">
      <div style="display: flex; flex-direction: column;">
        <a href="https://leagueofcomicgeeks.com/profile/victorsage/pull-list" target="_blank" rel="noopener" class="section-title">My Pulls</a>
        <div class="pulls-section">
          {{ range $pulls.Array "" }}
          <a href="{{ .String "comic_url" }}" target="_blank" rel="noopener" class="comic-pull">
            <img src="{{ .String "cover_medium" }}" alt="{{ .String "title" }}" loading="lazy" />
            <div class="comic-meta">
              <div class="comic-title">{{ .String "title" }}</div>
              <div class="comic-publisher">{{ .String "publisher" }}</div>
            </div>
          </a>
          {{ end }}
        </div>
      </div>

      <div style="display: flex; flex-direction: column;">
        <a href="https://leagueofcomicgeeks.com/comics/new-comics/{{ $nextWeek.Format "2006/01/02" }}" target="_blank" rel="noopener" class="section-title">Popular Pulls</a>
        <div class="popular-section">
          {{ range $popular.Array "" }}
          <div class="comic-popular">
            <a href="{{ .String "comic_url" }}" target="_blank" rel="noopener" title="{{ .String "title" }} — {{ .String "publisher" }}">
              <img src="{{ .String "cover_medium" }}" alt="{{ .String "title" }}" loading="lazy" />
            </a>
          </div>
          {{ end }}
        </div>
      </div>
    </div>